# current theme
set -g @plugin 'rose-pine/tmux'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @sessionx-bind 's'
set -g @continuum-restore 'on'

# Setup tmux theme
set -g @rose_pine_variant 'moon'

# By default rose-pine packs the session *and* the active window name into
# status-left, which leaves the real window list with nothing to show in the
# middle. This drops the window name from the left so status-left is just the
# session, and the centred window list below is the only place windows appear.
set -g @rose_pine_disable_active_window_menu 'on'

# Extended (CSI u) key reporting. Without this tmux flattens modifier+key combos
# to their unmodified form, so Shift+Enter reaches the application as a plain
# Enter and cannot be told apart from it — nothing the shell does can recover the
# difference, because the distinguishing bytes never arrive.
#
# `on` forwards extended keys to applications that ask for them; use `always` if
# something you use never requests them but you still want the distinct key.
# extended-keys-format picks the wire encoding: `xterm` (the default) sends
# Shift+Enter as \e[27;2;13~, `csi-u` sends it as \e[13;2u.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Toggle tmux status bar
bind '\' set status
if-shell "[[ $(tmux lsw | wc -l) -le 1 ]]" 'set -g status'

set -g status on

# Session on the left, window list centred. rose-pine leaves status-justify
# alone (its own `set status-justify` is commented out), so this survives tpm.
#
# absolute-centre, not centre: `centre` centres the window list in the free
# space *left over* after status-left, so a non-empty session name pushes the
# list right by half its width. absolute-centre uses the full terminal width and
# ignores what the left and right sections take up.
set -g status-justify absolute-centre

# Enable mouse
set -g mouse on

# Increase history limit
set -g history-limit 30000

# Start windows and panes at 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Zero-out escape time delay for quicker response
set -s escape-time 0

# keybindings
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# Is the focused pane running vim? Both the resize and the navigation bindings
# below hand the key through to it when so, and act on the tmux pane otherwise.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# resizing — nvim answers these with the <A-hjkl> maps in core/keymaps.lua
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

# navigation — the tmux half of christoomey/vim-tmux-navigator, which the nvim
# config has had on its own. Without these you could step out of nvim into a
# tmux pane but never back in, because nothing bound C-hjkl on this side.
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Open the new panes in the current path
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# If this is your first time using tmux, you will need to press (Ctrl + Space) + I to fetch the plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
run '~/.config/tmux/plugins/tpm/tpm'
