# Prompt layout: what changes on the left, machine context on the right, with
# $fill eating the gap between them. $fill rather than right_format, which
# would sit on the input line and fight zsh-autosuggestions' ghost text.
#
# format and palette must come before any [table]: keys after a header belong
# to that table, and starship drops them without an error.
format = """
$directory$git_branch$git_state$git_status\
$fill\
$php$nodejs$python$golang$java$docker_context$cmd_duration$time
$character"""

palette = "rose-pine-moon"

# --- palette ----------------------------------------------------------------
[palettes.rose-pine-moon]
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"

# --- prompt -----------------------------------------------------------------
[fill]
symbol = " "

[character]
success_symbol = "[❯](bold iris)"
error_symbol = "[❯](bold love)"
vimcmd_symbol = "[❮](bold foam)"

# --- left: what changes -----------------------------------------------------
# The formats drop starship's "on" and "via": with the two sides split by the
# fill, those words were left hanging mid-line.
[directory]
style = "bold foam"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "bold love"

[git_branch]
style = "bold iris"
format = "[$symbol$branch]($style) "

[git_state]
style = "bold love"

# gold = work pending, iris = clean, foam = ahead, rose = behind, love = gone.
[git_status]
style = "bold gold"
format = "([$all_status$ahead_behind]($style))"
up_to_date = "[✓](bold iris)"
untracked  = "[?\\($count\\)](bold gold)"
stashed    = "[\\$](bold iris)"
modified   = "[!\\($count\\)](bold gold)"
staged     = "[++\\($count\\)](bold gold)"
renamed    = "[»\\($count\\)](bold iris)"
deleted    = "[✘\\($count\\)](bold love)"
ahead      = "[⇡\\($count\\)](bold foam)"
behind     = "[⇣\\($count\\)](bold rose)"
diverged   = "[⇕⇡\\($ahead_count\\)⇣\\($behind_count\\)](bold iris)"

# --- right: machine context -------------------------------------------------
# One colour per category: languages pine, tools rose. One per module would be
# a rainbow with nothing of Rose Pine in it.
[php]
style = "bold pine"
format = "[  $symbol($version)]($style)"

[nodejs]
style = "bold pine"
format = "[  $symbol($version)]($style)"

[python]
style = "bold pine"
format = "[  $symbol($version)]($style)"

[golang]
style = "bold pine"
format = "[  $symbol($version)]($style)"

[java]
style = "bold pine"
format = "[  $symbol($version)]($style)"

[docker_context]
style = "bold rose"
format = "[  $symbol$context]($style)"

[cmd_duration]
style = "subtle"
format = "[  $duration]($style)"

[time]
disabled = false
style = "subtle"
format = "[  $time]($style)"
time_format = "%H:%M"
