"$schema" = 'https://starship.rs/config-schema.json'

# Blank line above each prompt, so successive commands don't run together.
add_newline = true

# The trailing `\` is a TOML line continuation: it eats the newline *and* the
# next line's indentation, so these modules concatenate with nothing between
# them. Removing the backslashes would insert real line breaks, not spaces —
# every gap below comes from a leading space inside the module's own `format`,
# which is what keeps an empty module from leaving an orphan space behind.
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs$python$golang$lua\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

palette = 'rose_pine_moon'

# Matches ghostty's theme, bat's config, tmux's rose_pine variant and nvim.
[palettes.rose_pine_moon]
base           = '#232136'
surface        = '#2a273f'
overlay        = '#393552'
muted          = '#6e6a86'
subtle         = '#908caa'
text           = '#e0def4'
love           = '#eb6f92'
gold           = '#f6c177'
rose           = '#ea9a97'
pine           = '#3e8fb0'
foam           = '#9ccfd8'
iris           = '#c4a7e7'
highlight_med  = '#44415a'

# No trailing space here: every following module supplies its own leading one,
# so a trailing space would double the gap after the path.
[directory]
style = 'foam'
format = '[$path]($style)[$read_only]($read_only_style)'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' 󰌾'
read_only_style = 'love'

# Inside a repo, show the repo name in a distinct colour and only the path below
# it — so you can see which project you're in and where, without the leading
# ~/dev/... noise on every prompt.
truncate_to_repo = true
repo_root_style = 'bold iris'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

# Substitutions match anywhere in the rendered path, so they must include the
# folder name — an icon on its own replaces it and loses the text.
[directory.substitutions]
'~/dev' = '󰲋 dev'

[git_branch]
symbol = ' '
style = 'iris'
format = ' [$symbol$branch]($style)'
truncation_length = 24
truncation_symbol = '…'

# Counts rather than bare symbols — "!3 +1 ?2" says more than "!+?" at the same
# width, and tells you when a `git add` actually staged everything.
# Each token carries a *leading* space rather than a trailing one. With trailing
# spaces a clean repo rendered as a lone orphan space and a dirty one left the
# line ending in whitespace; leading spaces mean an empty status renders as
# nothing at all.
[git_status]
style = 'gold'
format = '[$all_status$ahead_behind]($style)'
conflicted = ' =${count}'
ahead      = ' ⇡${count}'
behind     = ' ⇣${count}'
diverged   = ' ⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked  = ' ?${count}'
stashed    = ' ≡${count}'
modified   = ' !${count}'
staged     = ' +${count}'
renamed    = ' »${count}'
deleted    = ' ✘${count}'

[git_state]
style = 'love'
format = '[ \($state$progress_current/$progress_total\)]($style)'
rebase = 'REBASE'
merge = 'MERGE'
revert = 'REVERT'
cherry_pick = 'CHERRY-PICK'
bisect = 'BISECT'

# Language modules only appear inside a project that actually uses them, so the
# prompt stays short everywhere else.
[nodejs]
symbol = ' '
style = 'pine'
format = ' [$symbol($version)]($style)'
detect_files = ['package.json', '.node-version', '.nvmrc']

[python]
symbol = ' '
style = 'gold'
format = ' [$symbol($version)( \($virtualenv\))]($style)'

[golang]
symbol = ' '
style = 'foam'
format = ' [$symbol($version)]($style)'

[lua]
symbol = ' '
style = 'iris'
format = ' [$symbol($version)]($style)'

[docker_context]
symbol = ' '
style = 'pine'
format = ' [$symbol$context]($style)'
only_with_files = true

[jobs]
symbol = ''
style = 'rose'
format = ' [$symbol$number]($style)'
number_threshold = 1

# Anything that took more than 2s is worth knowing about after the fact.
[cmd_duration]
min_time = 2000
style = 'muted'
format = ' [ $duration]($style)'
show_milliseconds = false

# vicmd_symbol is what makes vi mode legible — it flips with the cursor shape
# set in 40-keybindings.zsh.
[character]
success_symbol = '[❯](bold pine)'
error_symbol = '[❯](bold love)'
vicmd_symbol = '[❮](bold gold)'

# Off by default and not worth the prompt width here.
[package]
disabled = true
